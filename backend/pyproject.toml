[project]
name = "pannaga-backend"
version = "0.1.0"
description = "Hyperlocal Monsoon Onset & Break Prediction System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    # Database / GIS
    "sqlalchemy[asyncio]>=2.0.0",
    "geoalchemy2>=0.14.0",
    "alembic>=1.11.0",
    "asyncpg>=0.28.0",
    # Task queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Settings / Auth
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # HTTP client
    "httpx>=0.24.1",
    # Geo / data
    "shapely>=2.0.0",
    "geopandas>=0.13.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    "rasterio>=1.3.8",
    # Science
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
]

[project.optional-dependencies]
# Install ML extras with: uv pip install --system -e ".[ml]"
# Use CPU-only torch in Docker: --extra-index-url https://download.pytorch.org/whl/cpu
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.24.1",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

ml = [
    "torch>=2.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "strict"
testpaths = [
    "tests",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
